    - region [ref=f13e3693]:
      - paragraph [ref=f13e3694]: Open workflow · public portal
      - heading "Install the Columbus 311 case lookup" [level=2] [ref=f13e3695]
      - paragraph [ref=f13e3696]: A portable, read-only workflow for finding a Columbus 311 case by address and CAS ID, then separating portal facts from vendor and accessibility evidence. Claude accepts the ZIP as a native custom skill; ChatGPT and Gemini use the same Markdown as reusable project or Gem context.
      - generic "Skill downloads" [ref=f13e3697]:
        - link "Download skill · ZIP" [ref=f13e3698] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.zip
        - link "Download instructions · Markdown" [ref=f13e3699] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.txt
        - link "Read full installation guide" [ref=f13e3700] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup/INSTALL.md
      - generic [ref=f13e3701]:
        - article [ref=f13e3702]:
          - heading "Claude" [level=3] [ref=f13e3703]
          - generic [ref=f13e3704]: Native custom skill
          - list [ref=f13e3705]:
            - listitem [ref=f13e3706]: Download the ZIP package.
            - listitem [ref=f13e3707]: Enable code execution in Settings → Capabilities.
            - listitem [ref=f13e3708]: Open Customize → Skills → + Create skill → Upload a skill.
            - listitem [ref=f13e3709]: Upload, enable, and invoke it with a CAS ID and address.
          - paragraph [ref=f13e3710]:
            - link "Claude’s official skill guide" [ref=f13e3711] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/12512180-use-skills-in-claude
        - article [ref=f13e3712]:
          - heading "ChatGPT" [level=3] [ref=f13e3713]
          - generic [ref=f13e3714]: Project instructions + source
          - list [ref=f13e3715]:
            - listitem [ref=f13e3716]: Download the Markdown instructions.
            - listitem [ref=f13e3717]: Create a Project and upload the file as a source.
            - listitem [ref=f13e3718]: Add a Project instruction to follow the workflow for Columbus CAS IDs.
            - listitem [ref=f13e3719]: Supply both the case ID and address; allow web access when asked.
          - paragraph [ref=f13e3720]:
            - link "OpenAI’s official Projects guide" [ref=f13e3721] [cursor=pointer]:
              - /url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
        - article [ref=f13e3722]:
          - heading "Gemini" [level=3] [ref=f13e3723]
          - generic [ref=f13e3724]: Gem instructions + knowledge
          - list [ref=f13e3725]:
            - listitem [ref=f13e3726]: Download the Markdown instructions.
            - listitem [ref=f13e3727]: Open Gems → New Gem in the Gemini web app.
            - listitem [ref=f13e3728]: Add the workflow to the Gem instructions and upload the file under Knowledge.
            - listitem [ref=f13e3729]: Save, then supply both the case ID and address.
          - paragraph [ref=f13e3730]:
            - link "Google’s official Gems guide" [ref=f13e3731] [cursor=pointer]:
              - /url: https://support.google.com/gemini/answer/15146780?co=GENIE.Platform%3DDesktop&hl=en
      - paragraph [ref=f13e3732]: Review AI instruction packages before installing them. This workflow uses a public, read-only portal, requires no login, and should never submit, edit, or comment on a 311 request.
