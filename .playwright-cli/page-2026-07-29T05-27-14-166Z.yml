    - region [ref=e4191]:
      - paragraph [ref=e4192]: Open workflow · public portal
      - heading "Install the Columbus 311 case lookup" [level=2] [ref=e4193]
      - paragraph [ref=e4194]: A portable, read-only workflow for finding a Columbus 311 case by address and CAS ID, then separating portal facts from vendor and accessibility evidence. Claude accepts the ZIP as a native custom skill; ChatGPT and Gemini use the same Markdown as reusable project or Gem context.
      - generic "Skill downloads" [ref=e4195]:
        - link "Download skill · ZIP" [ref=e4196] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.zip
        - link "Download instructions · Markdown" [ref=e4197] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.txt
        - link "Read full installation guide" [ref=e4198] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup/INSTALL.md
      - generic [ref=e4199]:
        - article [ref=e4200]:
          - heading "Claude" [level=3] [ref=e4201]
          - generic [ref=e4202]: Native custom skill
          - list [ref=e4203]:
            - listitem [ref=e4204]: Download the ZIP package.
            - listitem [ref=e4205]: Enable code execution in Settings → Capabilities.
            - listitem [ref=e4206]: Open Customize → Skills → + Create skill → Upload a skill.
            - listitem [ref=e4207]: Upload, enable, and invoke it with a CAS ID and address.
          - paragraph [ref=e4208]:
            - link "Claude’s official skill guide" [ref=e4209] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/12512180-use-skills-in-claude
        - article [ref=e4210]:
          - heading "ChatGPT" [level=3] [ref=e4211]
          - generic [ref=e4212]: Project instructions + source
          - list [ref=e4213]:
            - listitem [ref=e4214]: Download the Markdown instructions.
            - listitem [ref=e4215]: Create a Project and upload the file as a source.
            - listitem [ref=e4216]: Add a Project instruction to follow the workflow for Columbus CAS IDs.
            - listitem [ref=e4217]: Supply both the case ID and address; allow web access when asked.
          - paragraph [ref=e4218]:
            - link "OpenAI’s official Projects guide" [ref=e4219] [cursor=pointer]:
              - /url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
        - article [ref=e4220]:
          - heading "Gemini" [level=3] [ref=e4221]
          - generic [ref=e4222]: Gem instructions + knowledge
          - list [ref=e4223]:
            - listitem [ref=e4224]: Download the Markdown instructions.
            - listitem [ref=e4225]: Open Gems → New Gem in the Gemini web app.
            - listitem [ref=e4226]: Add the workflow to the Gem instructions and upload the file under Knowledge.
            - listitem [ref=e4227]: Save, then supply both the case ID and address.
          - paragraph [ref=e4228]:
            - link "Google’s official Gems guide" [ref=e4229] [cursor=pointer]:
              - /url: https://support.google.com/gemini/answer/15146780?co=GENIE.Platform%3DDesktop&hl=en
      - paragraph [ref=e4230]: Review AI instruction packages before installing them. This workflow uses a public, read-only portal, requires no login, and should never submit, edit, or comment on a 311 request.
