      - heading "Install the Columbus 311 case lookup" [level=2] [ref=e99]
      - paragraph [ref=e100]: A portable, read-only workflow for finding a Columbus 311 case by address and CAS ID, then separating portal facts from vendor and accessibility evidence. Claude accepts the ZIP as a native custom skill; ChatGPT and Gemini use the same Markdown as reusable project or Gem context.
