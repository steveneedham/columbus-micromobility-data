        - link "Download skill · ZIP" [ref=e102] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.zip
        - link "Download instructions · Markdown" [ref=e103] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.txt
        - link "Read full installation guide" [ref=e104] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup/INSTALL.md
      - generic [ref=e105]:
        - article [ref=e106]:
          - heading "Claude" [level=3] [ref=e107]
          - generic [ref=e108]: Native custom skill
          - list [ref=e109]:
            - listitem [ref=e110]: Download the ZIP package.
            - listitem [ref=e111]: Enable code execution in Settings → Capabilities.
            - listitem [ref=e112]: Open Customize → Skills → + Create skill → Upload a skill.
            - listitem [ref=e113]: Upload, enable, and invoke it with a CAS ID and address.
          - paragraph [ref=e114]:
            - link "Claude’s official skill guide" [ref=e115] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/12512180-use-skills-in-claude
        - article [ref=e116]:
          - heading "ChatGPT" [level=3] [ref=e117]
          - generic [ref=e118]: Project instructions + source
          - list [ref=e119]:
            - listitem [ref=e120]: Download the Markdown instructions.
            - listitem [ref=e121]: Create a Project and upload the file as a source.
            - listitem [ref=e122]: Add a Project instruction to follow the workflow for Columbus CAS IDs.
            - listitem [ref=e123]: Supply both the case ID and address; allow web access when asked.
          - paragraph [ref=e124]:
            - link "OpenAI’s official Projects guide" [ref=e125] [cursor=pointer]:
              - /url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
        - article [ref=e126]:
          - heading "Gemini" [level=3] [ref=e127]
          - generic [ref=e128]: Gem instructions + knowledge
          - list [ref=e129]:
            - listitem [ref=e130]: Download the Markdown instructions.
            - listitem [ref=e131]: Open Gems → New Gem in the Gemini web app.
            - listitem [ref=e132]: Add the workflow to the Gem instructions and upload the file under Knowledge.
            - listitem [ref=e133]: Save, then supply both the case ID and address.
          - paragraph [ref=e134]:
            - link "Google’s official Gems guide" [ref=e135] [cursor=pointer]:
              - /url: https://support.google.com/gemini/answer/15146780?co=GENIE.Platform%3DDesktop&hl=en
      - paragraph [ref=e136]: Review AI instruction packages before installing them. This workflow uses a public, read-only portal, requires no login, and should never submit, edit, or comment on a 311 request.
