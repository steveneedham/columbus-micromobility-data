    - region [ref=f2e3696]:
      - paragraph [ref=f2e3697]: Open workflow · public portal
      - heading "Install the Columbus 311 case lookup" [level=2] [ref=f2e3698]
      - paragraph [ref=f2e3699]: A portable, read-only workflow for finding a Columbus 311 case by address and CAS ID, then separating portal facts from vendor and accessibility evidence. Claude accepts the ZIP as a native custom skill; ChatGPT and Gemini use the same Markdown as reusable project or Gem context.
      - generic "Skill downloads" [ref=f2e3700]:
        - link "Download skill · ZIP" [ref=f2e3701] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.zip
        - link "Download instructions · Markdown" [ref=f2e3702] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.txt
        - link "Read full installation guide" [ref=f2e3703] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup/INSTALL.md
      - generic [ref=f2e3704]:
        - article [ref=f2e3705]:
          - heading "Claude" [level=3] [ref=f2e3706]
          - generic [ref=f2e3707]: Native custom skill
          - list [ref=f2e3708]:
            - listitem [ref=f2e3709]: Download the ZIP package.
            - listitem [ref=f2e3710]: Enable code execution in Settings → Capabilities.
            - listitem [ref=f2e3711]: Open Customize → Skills → + Create skill → Upload a skill.
            - listitem [ref=f2e3712]: Upload, enable, and invoke it with a CAS ID and address.
          - paragraph [ref=f2e3713]:
            - link "Claude’s official skill guide" [ref=f2e3714] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/12512180-use-skills-in-claude
        - article [ref=f2e3715]:
          - heading "ChatGPT" [level=3] [ref=f2e3716]
          - generic [ref=f2e3717]: Project instructions + source
          - list [ref=f2e3718]:
            - listitem [ref=f2e3719]: Download the Markdown instructions.
            - listitem [ref=f2e3720]: Create a Project and upload the file as a source.
            - listitem [ref=f2e3721]: Add a Project instruction to follow the workflow for Columbus CAS IDs.
            - listitem [ref=f2e3722]: Supply both the case ID and address; allow web access when asked.
          - paragraph [ref=f2e3723]:
            - link "OpenAI’s official Projects guide" [ref=f2e3724] [cursor=pointer]:
              - /url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
        - article [ref=f2e3725]:
          - heading "Gemini" [level=3] [ref=f2e3726]
          - generic [ref=f2e3727]: Gem instructions + knowledge
          - list [ref=f2e3728]:
            - listitem [ref=f2e3729]: Download the Markdown instructions.
            - listitem [ref=f2e3730]: Open Gems → New Gem in the Gemini web app.
            - listitem [ref=f2e3731]: Add the workflow to the Gem instructions and upload the file under Knowledge.
            - listitem [ref=f2e3732]: Save, then supply both the case ID and address.
          - paragraph [ref=f2e3733]:
            - link "Google’s official Gems guide" [ref=f2e3734] [cursor=pointer]:
              - /url: https://support.google.com/gemini/answer/15146780?co=GENIE.Platform%3DDesktop&hl=en
      - paragraph [ref=f2e3735]: Review AI instruction packages before installing them. This workflow uses a public, read-only portal, requires no login, and should never submit, edit, or comment on a 311 request.
