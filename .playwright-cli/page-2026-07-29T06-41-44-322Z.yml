      - paragraph [ref=e3952]: Open workflow · public portal
      - heading "Install the Columbus 311 case lookup" [level=2] [ref=e3953]
      - paragraph [ref=e3954]: A portable, read-only workflow for finding a Columbus 311 case by address and CAS ID, then separating portal facts from vendor and accessibility evidence. Claude accepts the ZIP as a native custom skill; ChatGPT and Gemini use the same Markdown as reusable project or Gem context.
      - generic "Skill downloads" [ref=e3955]:
        - link "Download skill · ZIP" [ref=e3956] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.zip
        - link "Download instructions · Markdown" [ref=e3957] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup.txt
        - link "Read full installation guide" [ref=e3958] [cursor=pointer]:
          - /url: downloads/columbus-311-case-lookup/INSTALL.md
      - generic [ref=e3959]:
        - article [ref=e3960]:
          - heading "Claude" [level=3] [ref=e3961]
          - generic [ref=e3962]: Native custom skill
          - list [ref=e3963]:
            - listitem [ref=e3964]: Download the ZIP package.
            - listitem [ref=e3965]: Enable code execution in Settings → Capabilities.
            - listitem [ref=e3966]: Open Customize → Skills → + Create skill → Upload a skill.
            - listitem [ref=e3967]: Upload, enable, and invoke it with a CAS ID and address.
          - paragraph [ref=e3968]:
            - link "Claude’s official skill guide" [ref=e3969] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/12512180-use-skills-in-claude
        - article [ref=e3970]:
          - heading "ChatGPT" [level=3] [ref=e3971]
          - generic [ref=e3972]: Project instructions + source
          - list [ref=e3973]:
            - listitem [ref=e3974]: Download the Markdown instructions.
            - listitem [ref=e3975]: Create a Project and upload the file as a source.
            - listitem [ref=e3976]: Add a Project instruction to follow the workflow for Columbus CAS IDs.
            - listitem [ref=e3977]: Supply both the case ID and address; allow web access when asked.
          - paragraph [ref=e3978]:
            - link "OpenAI’s official Projects guide" [ref=e3979] [cursor=pointer]:
              - /url: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
        - article [ref=e3980]:
          - heading "Gemini" [level=3] [ref=e3981]
          - generic [ref=e3982]: Gem instructions + knowledge
          - list [ref=e3983]:
            - listitem [ref=e3984]: Download the Markdown instructions.
            - listitem [ref=e3985]: Open Gems → New Gem in the Gemini web app.
            - listitem [ref=e3986]: Add the workflow to the Gem instructions and upload the file under Knowledge.
            - listitem [ref=e3987]: Save, then supply both the case ID and address.
          - paragraph [ref=e3988]:
            - link "Google’s official Gems guide" [ref=e3989] [cursor=pointer]:
              - /url: https://support.google.com/gemini/answer/15146780?co=GENIE.Platform%3DDesktop&hl=en
