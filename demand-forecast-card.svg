<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Columbus Micromobility Demand Forecast — project card</title>
<desc>Dark portfolio project card with a bike icon, title "Columbus Micromobility Demand Forecast," and a one-line descriptor, styled in Steven Needham's dark-ops design system with a teal systems-track accent.</desc>

<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1B1F27"/>
    <stop offset="1" stop-color="#14171C"/>
  </linearGradient>
  <style>
    .display { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
    .body { font-family: 'Inter', Arial, Helvetica, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
</defs>

<rect width="1200" height="630" fill="#14171C"/>
<rect x="0" y="0" width="1200" height="630" fill="url(#edge)" opacity="0.6"/>
<rect x="1" y="1" width="1198" height="628" fill="none" stroke="#282E38" stroke-width="2"/>

<g opacity="0.5">
  <circle cx="1040" cy="90" r="2" fill="#2C6A64"/>
  <circle cx="1080" cy="130" r="2" fill="#2C6A64"/>
  <circle cx="1000" cy="140" r="2" fill="#2C6A64"/>
  <circle cx="1120" cy="90" r="2" fill="#2C6A64"/>
</g>

<text x="80" y="120" class="mono" font-size="15" letter-spacing="2.5" fill="#4FD1C5">PROJECT · FORECASTING</text>

<text x="78" y="230" class="display" font-weight="500" font-size="64" fill="#EDEAE2">Columbus Micromobility</text>
<text x="78" y="300" class="display" font-weight="500" font-size="64" fill="#EDEAE2">Demand Forecast</text>

<text x="80" y="360" class="body" font-size="21" fill="#8B93A1">Predicting where 311 complaint pressure will build next —</text>
<text x="80" y="392" class="body" font-size="21" fill="#8B93A1">from public 311 and GBFS signals only, no operator data.</text>

<g class="mono" font-size="13" letter-spacing="1">
  <rect x="80" y="430" width="100" height="34" rx="4" fill="none" stroke="#282E38"/>
  <text x="98" y="452" fill="#8B93A1">311 DATA</text>

  <rect x="192" y="430" width="88" height="34" rx="4" fill="none" stroke="#282E38"/>
  <text x="210" y="452" fill="#8B93A1">GBFS</text>

  <rect x="292" y="430" width="130" height="34" rx="4" fill="none" stroke="#282E38"/>
  <text x="310" y="452" fill="#8B93A1">FORECASTING</text>
</g>

<g transform="translate(920,420) scale(2.1)" fill="none" stroke="#4FD1C5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="18" cy="46" r="13"/>
  <circle cx="66" cy="46" r="13"/>
  <path d="M18,46 L38,20 L58,46 M38,20 L32,10 M28,10 L38,10"/>
  <path d="M38,20 L66,46"/>
  <path d="M18,46 L52,46"/>
  <circle cx="52" cy="46" r="2.6" fill="#4FD1C5"/>
</g>

<text x="80" y="576" class="mono" font-size="13" letter-spacing="1.5" fill="#5B6270">STEVENEEDHAM.GITHUB.IO · INDEPENDENT PROJECT</text>

</svg>
