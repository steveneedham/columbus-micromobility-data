<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Micro-Sites — Columbus Micromobility Data</title>
    <meta name="description" content="Explore neighborhood-specific data views for Columbus micromobility.">
    <link rel="canonical" href="https://steveneedham.github.io/columbus-micromobility-data/micro-sites/">
    <link rel="icon" type="image/svg+xml" href="../assets/field-ledger-mark.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&display=swap');
        :root { --color-surface: #f3f0e8; --color-text: #1a1714; --color-text-secondary: #5a5550; --color-border: #ccc8bf; --color-accent-amber: #faa71a; }
        @media (prefers-color-scheme: dark) { :root { --color-surface: #1a1714; --color-text: #f3f0e8; --color-text-secondary: #a89f95; --color-border: #3a3530; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: var(--color-surface); color: var(--color-text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { margin-bottom: 3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 2rem; }
        header a { color: var(--color-accent-amber); text-decoration: none; font-size: 0.875rem; display: inline-block; margin-bottom: 1rem; }
        h1 { font-size: 2.5rem; font-weight: 600; margin: 1rem 0; font-family: 'Newsreader', serif; }
        .description { color: var(--color-text-secondary); font-size: 1.125rem; }
        .neighborhoods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .neighborhood-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 1.5rem; text-decoration: none; color: inherit; transition: all 0.2s ease; display: flex; flex-direction: column; }
        .neighborhood-card:hover { border-color: var(--color-accent-amber); box-shadow: 0 4px 12px rgba(250, 167, 26, 0.1); transform: translateY(-2px); }
        .card-icon { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.9; }
        .card-title { font-size: 1.25rem; font-weight: 600; color: var(--color-text); font-family: 'Newsreader', serif; }
        .card-description { font-size: 0.875rem; color: var(--color-text-secondary); line-height: 1.5; }
        .card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--color-border); }
        .stat { display: flex; flex-direction: column; gap: 0.25rem; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); }
        .stat-value { font-size: 1.5rem; font-weight: 600; color: var(--color-accent-amber); font-family: 'IBM Plex Mono', monospace; }
        footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--color-border); font-size: 0.875rem; color: var(--color-text-secondary); }
        @media (max-width: 768px) { .neighborhoods-grid { grid-template-columns: 1fr; } h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../">← Back to main</a>
            <h1>Neighborhood Micro-Sites</h1>
            <p class="description">Explore neighborhood-specific data for Columbus micromobility.</p>
        </header>
        <div class="neighborhoods-grid" id="neighborhoods"></div>
        <footer>
            <p>Data sources: Columbus 311, GBFS operators (Veo, Spin), OpenStreetMap</p>
        </footer>
    </div>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
        const neighborhoods = [
            { slug: "bexley", name: "Bexley", description: "Eastern suburb", icon: "bexley" },
            { slug: "dublin", name: "Dublin", description: "Northern suburb", icon: "dublin" },
            { slug: "the-ohio-state-university", name: "The Ohio State University", description: "Campus area", icon: "the-ohio-state-university" },
            { slug: "grandview-heights", name: "Grandview Heights", description: "Northern residential", icon: "grandview-heights" },
            { slug: "marble-cliff", name: "Marble Cliff", description: "Upscale suburb", icon: "marble-cliff" },
            { slug: "upper-arlington", name: "Upper Arlington", description: "Residential west", icon: "upper-arlington" },
            { slug: "harrison-west", name: "Harrison West", description: "Mixed-use downtown", icon: "harrison-west" },
            { slug: "short-north", name: "Short North", description: "Trendy urban", icon: "short-north" },
            { slug: "italian-village", name: "Italian Village", description: "Historic district", icon: "italian-village" },
            { slug: "downtown", name: "Downtown", description: "Business district", icon: "downtown" }
        ];

        function pointInPolygon(point, boundaryGeoJSON) {
            try {
                if (!boundaryGeoJSON || !boundaryGeoJSON.features) return false;
                const polygon = boundaryGeoJSON.features[0];
                return turf.booleanPointInPolygon(point, polygon);
            } catch (e) {
                return false;
            }
        }

        async function loadAndDisplayNeighborhoods() {
            try {
                // Load data files
                const [gbfsResponse, c311Response, hubsResponse] = await Promise.all([
                    fetch('/columbus-micromobility-data/data-gbfs.json'),
                    fetch('/columbus-micromobility-data/data-311.json'),
                    fetch('/columbus-micromobility-data/data-ride-hubs.json')
                ]);

                const gbfsData = await gbfsResponse.json();
                const c311Data = await c311Response.json();

                // Load all neighborhood boundaries in parallel
                const boundaryPromises = neighborhoods.map(n =>
                    fetch(`${n.slug}/boundary.geojson`).then(r => r.json()).catch(() => null)
                );
                const boundaries = await Promise.all(boundaryPromises);

                // Calculate counts for each neighborhood
                const container = document.getElementById('neighborhoods');
                neighborhoods.forEach((n, index) => {
                    const boundary = boundaries[index];
                    let c311Count = 0, gbfsCount = 0;

                    if (boundary) {
                        // Filter 311 requests
                        c311Count = c311Data.records.filter(record => {
                            const point = turf.point([record.longitude, record.latitude]);
                            return pointInPolygon(point, boundary);
                        }).length;

                        // Filter vehicles
                        gbfsData.vehicles.forEach(vehicle => {
                            const point = turf.point([vehicle.lng, vehicle.lat]);
                            if (pointInPolygon(point, boundary)) {
                                gbfsCount++;
                            }
                        });
                    }

                    // Create card
                    const card = document.createElement('a');
                    card.href = n.slug + '/';
                    card.className = 'neighborhood-card';
                    card.innerHTML = `<img src="../assets/neighborhood-icons/${n.icon}.svg" alt="" class="card-icon"><div class="card-title">${n.name}</div><div class="card-description">${n.description}</div><div class="card-stats"><div class="stat"><div class="stat-label">311</div><div class="stat-value">${c311Count}</div></div><div class="stat"><div class="stat-label">Vehicles</div><div class="stat-value">${gbfsCount}</div></div></div>`;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading neighborhood data:', err);
            }
        }

        loadAndDisplayNeighborhoods();
    </script>
</body>
</html>
