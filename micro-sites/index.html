<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Micro-Sites — Columbus Micromobility Data</title>
    <meta name="description" content="Explore neighborhood-specific data views for Columbus micromobility, including 311 service requests and shared vehicle locations.">
    <link rel="canonical" href="https://steveneedham.github.io/columbus-micromobility-data/micro-sites/">
    <link rel="icon" type="image/svg+xml" href="../assets/field-ledger-mark.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&display=swap');

        :root {
            --color-surface: #f3f0e8;
            --color-text: #1a1714;
            --color-text-secondary: #5a5550;
            --color-border: #ccc8bf;
            --color-accent-amber: #faa71a;
            --color-accent-teal: #00bfa5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-surface: #1a1714;
                --color-text: #f3f0e8;
                --color-text-secondary: #a89f95;
                --color-border: #3a3530;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-surface);
            color: var(--color-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 2rem;
        }

        header a {
            color: var(--color-accent-amber);
            text-decoration: none;
            font-size: 0.875rem;
            display: inline-block;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 1rem 0;
            font-family: 'Newsreader', serif;
        }

        .description {
            color: var(--color-text-secondary);
            font-size: 1.125rem;
            margin-top: 0.5rem;
        }

        .neighborhoods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .neighborhood-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .neighborhood-card:hover {
            border-color: var(--color-accent-amber);
            box-shadow: 0 4px 12px rgba(250, 167, 26, 0.1);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text);
            font-family: 'Newsreader', serif;
        }

        .card-description {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-accent-amber);
            font-family: 'IBM Plex Mono', monospace;
        }

        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        @media (max-width: 768px) {
            .neighborhoods-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../">← Back to main dashboard</a>
            <h1>Neighborhood Micro-Sites</h1>
            <p class="description">Explore neighborhood-specific data views showing 311 service requests and micromobility activity.</p>
        </header>

        <div class="neighborhoods-grid" id="neighborhoods">
            <!-- Populated by JavaScript -->
        </div>

        <footer>
            <p>Data sources: Columbus 311 Service Requests, GBFS operators (Veo, Spin), OpenStreetMap</p>
            <p>Last updated: <span id="updated-at"></span></p>
        </footer>
    </div>

    <script>
        const neighborhoods = [
            { slug: "bexley", name: "Bexley", description: "Eastern suburb with established residential and commercial areas.", c311: 5, gbfs: 0 },
            { slug: "dublin", name: "Dublin", description: "Northern suburb with mixed residential and commercial development.", c311: 1, gbfs: 0 },
            { slug: "the-ohio-state-university", name: "The Ohio State University", description: "Ohio State University campus and surrounding academic area.", c311: 0, gbfs: 0 },
            { slug: "grandview-heights", name: "Grandview Heights", description: "Northern suburb with residential neighborhoods.", c311: 2, gbfs: 0 },
            { slug: "marble-cliff", name: "Marble Cliff", description: "Upscale residential suburb north of downtown.", c311: 0, gbfs: 0 },
            { slug: "upper-arlington", name: "Upper Arlington", description: "Affluent residential suburb west of downtown.", c311: 1, gbfs: 0 },
            { slug: "harrison-west", name: "Harrison West", description: "Vibrant neighborhood with mixed-use development near downtown.", c311: 12, gbfs: 136 },
            { slug: "short-north", name: "Short North", description: "Trendy urban neighborhood with galleries, shops, and restaurants.", c311: 21, gbfs: 1093 },
            { slug: "italian-village", name: "Italian Village", description: "Historic neighborhood with Italian heritage and urban character.", c311: 58, gbfs: 852 },
            { slug: "downtown", name: "Downtown", description: "Columbus's central business and entertainment district.", c311: 21, gbfs: 1000 }
        ];

        const container = document.getElementById('neighborhoods');
        neighborhoods.forEach(neighborhood => {
            const card = document.createElement('a');
            card.href = neighborhood.slug + '/';
            card.className = 'neighborhood-card';
            card.innerHTML = `
                <div class="card-title">${neighborhood.name}</div>
                <div class="card-description">${neighborhood.description}</div>
                <div class="card-stats">
                    <div class="stat">
                        <div class="stat-label">311 Requests</div>
                        <div class="stat-value">${neighborhood.c311}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Vehicles</div>
                        <div class="stat-value">${neighborhood.gbfs}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('updated-at').textContent = new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    </script>
</body>
</html>
