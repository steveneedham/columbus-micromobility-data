name: Pull GBFS Data

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC
    - cron: '0 20 * * *'  # 8pm UTC
  workflow_dispatch:

jobs:
  fetch-gbfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install papermill ipykernel pandas requests

      - name: Run GBFS extraction notebook
        run: |
          papermill Veo_Spin_CBS_GBFS_Extract.ipynb /dev/null \
            -p output_dir snapshots \
            -p timestamp "$(date -u +'%Y%m%dT%H%M%SZ')"
        continue-on-error: true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add snapshots/columbus_scooters_*.csv 2>/dev/null || true
          git add plots/ 2>/dev/null || true
          if git diff --cached --exit-code > /dev/null; then
            echo "No new data to commit"
          else
            git commit -m "GBFS data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Trigger rebuild
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rebuild-site.yml',
              ref: 'main'
            })
