name: Scheduled Colab Run

on:
  schedule:
    - cron: '0 8 * * *' # Runs everyday at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
       uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install papermill nbconvert

      - name: Execute notebook
        run: |
          papermill your-notebook-name.ipynb output-notebook.ipynb
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated fleet data & plots update" || echo "No changes to commit"
          git push
