name: Scheduled Colab Run

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC
    - cron: '0 20 * * *' # 8pm UTC (new)
  workflow_dispatch:: # Allows manual trigger

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    
    # ⚠️ REQUIRED: Gives the action permission to push back to your repo
    permissions: 
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # Added ipykernel and registered the python3 kernel
          pip install ipykernel papermill nbconvert pandas matplotlib seaborn requests
          python -m ipykernel install --user --name python3

      - name: Execute notebook
        run: |
          papermill Veo_Spin_CBS_GBFS_Extract.ipynb output-notebook.ipynb
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated fleet data & plots update" || echo "No changes to commit"
          git push
