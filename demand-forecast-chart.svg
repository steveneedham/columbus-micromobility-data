<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Illustrative Columbus micromobility demand forecast by hour</title>
<desc>Sample line chart showing an illustrative predicted 311 complaint-pressure curve across a 24-hour day, comparing a weekday and weekend pattern. Clearly labeled as sample/illustrative data, not real model output.</desc>

<defs>
  <style>
    .display { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
    .body { font-family: 'Inter', Arial, Helvetica, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
</defs>

<rect width="900" height="560" fill="#14171C"/>
<rect x="1" y="1" width="898" height="558" fill="none" stroke="#282E38" stroke-width="2"/>

<text x="60" y="60" class="mono" font-size="13" letter-spacing="2" fill="#E8A33D">ILLUSTRATIVE — SAMPLE DATA, NOT MODEL OUTPUT</text>

<text x="58" y="104" class="display" font-weight="500" font-size="30" fill="#EDEAE2">Predicted 311 demand pressure, by hour</text>
<text x="58" y="132" class="body" font-size="15" fill="#8B93A1">Columbus Micromobility Demand Forecast — public 311 + GBFS signals only</text>

<g class="mono" font-size="12" letter-spacing="1">
  <circle cx="62" cy="162" r="5" fill="#4FD1C5"/>
  <text x="74" y="167" fill="#8B93A1">WEEKDAY (SAMPLE)</text>
  <circle cx="230" cy="162" r="5" fill="#E8A33D"/>
  <text x="242" y="167" fill="#8B93A1">WEEKEND (SAMPLE)</text>
</g>

<g>
  <line x1="70" y1="480" x2="850" y2="480" stroke="#282E38" stroke-width="1.5"/>
  <line x1="70" y1="200" x2="70" y2="480" stroke="#282E38" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="850" y2="340" stroke="#282E38" stroke-width="1"/>
  <line x1="70" y1="200" x2="850" y2="200" stroke="#282E38" stroke-width="1"/>

  <text x="55" y="484" text-anchor="end" class="mono" font-size="11" fill="#5B6270">low</text>
  <text x="55" y="344" text-anchor="end" class="mono" font-size="11" fill="#5B6270">mid</text>
  <text x="55" y="204" text-anchor="end" class="mono" font-size="11" fill="#5B6270">high</text>

  <g class="mono" font-size="11" fill="#5B6270">
    <text x="70" y="504">6a</text>
    <text x="200" y="504">9a</text>
    <text x="330" y="504">12p</text>
    <text x="460" y="504">3p</text>
    <text x="590" y="504">6p</text>
    <text x="720" y="504">9p</text>
    <text x="840" y="504" text-anchor="end">12a</text>
  </g>

  <path d="M70,460 C 150,430 190,300 260,270 C 320,246 360,320 420,340 C 480,358 540,300 610,240 C 680,190 740,220 800,270 L850,300"
        fill="none" stroke="#4FD1C5" stroke-width="3.5" stroke-linecap="round"/>

  <path d="M70,470 C 160,465 220,440 300,400 C 380,360 440,260 520,230 C 590,206 650,220 720,260 C 770,286 810,320 850,340"
        fill="none" stroke="#E8A33D" stroke-width="3.5" stroke-linecap="round"/>
</g>

<text x="58" y="536" class="body" font-size="13" fill="#5B6270">Shape is illustrative only — the underlying forecasting model has not been built or validated yet.</text>

</svg>
