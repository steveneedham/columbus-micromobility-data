<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Analysis 2026 weekly event projection</title>
  <desc id="desc">Field Ledger-style chart of confirmed or logged events, projected additional events, and the 2024 to 2025 same-week baseline for ISO weeks 32 through 53 of 2026, derived from the ChatGPT Forecast workbook.</desc>
