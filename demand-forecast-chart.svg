<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative weekly demand signals</title>
  <desc id="desc">Field Ledger-style chart showing illustrative major-event, home-game, and projected weather-risk signals by ISO week. Values are not model output.</desc>
  <style>
    .display{font-family:Newsreader,Georgia,'Times New Roman',serif}
    .body{font-family:'IBM Plex Sans',Arial,sans-serif}
    .mono{font-family:'IBM Plex Mono','Courier New',monospace}
  </style>
  <rect width="900" height="560" fill="#F3F0E8"/>
  <rect x="1" y="1" width="898" height="558" fill="none" stroke="#D5D0C5" stroke-width="2"/>
  <text x="54" y="52" class="mono" font-size="11" font-weight="600" letter-spacing="1.6" fill="#A94728">CHATGPT FORECAST · ILLUSTRATIVE STRUCTURE</text>
  <text x="52" y="96" class="display" font-size="30" font-weight="500" fill="#202A2E">Weekly demand signals, by ISO week</text>
  <text x="54" y="124" class="body" font-size="14" fill="#5D696D">Events, routine home games, and weather remain visible as separate layers.</text>

  <g transform="translate(54 150)" class="mono" font-size="10.5" fill="#5D696D">
    <circle cx="5" cy="4" r="4" fill="#236A73"/><text x="17" y="8">MAJOR EVENTS</text>
    <circle cx="151" cy="4" r="4" fill="#202A2E"/><text x="163" y="8">HOME GAMES</text>
    <circle cx="294" cy="4" r="4" fill="#A94728"/><text x="306" y="8">WEATHER RISK</text>
  </g>

  <g transform="translate(72 194)">
    <line x1="0" y1="0" x2="0" y2="250" stroke="#C8C2B5"/>
    <line x1="0" y1="250" x2="772" y2="250" stroke="#C8C2B5"/>
    <g stroke="#D5D0C5" stroke-width="1">
      <line x1="0" y1="188" x2="772" y2="188"/>
      <line x1="0" y1="125" x2="772" y2="125"/>
      <line x1="0" y1="63" x2="772" y2="63"/>
      <line x1="0" y1="0" x2="772" y2="0"/>
    </g>
    <g class="mono" font-size="10" fill="#5D696D">
      <text x="-15" y="254" text-anchor="end">0</text>
      <text x="-15" y="192" text-anchor="end">4</text>
      <text x="-15" y="129" text-anchor="end">8</text>
      <text x="-15" y="67" text-anchor="end">12</text>
      <text x="-15" y="4" text-anchor="end">16</text>
    </g>

    <g fill="#202A2E" opacity=".9">
      <rect x="22" y="188" width="18" height="62"/><rect x="112" y="157" width="18" height="93"/>
      <rect x="202" y="125" width="18" height="125"/><rect x="292" y="172" width="18" height="78"/>
      <rect x="382" y="94" width="18" height="156"/><rect x="472" y="141" width="18" height="109"/>
      <rect x="562" y="110" width="18" height="140"/><rect x="652" y="172" width="18" height="78"/>
    </g>
    <path d="M31 219 L121 203 L211 141 L301 188 L391 110 L481 172 L571 94 L661 157"
          fill="none" stroke="#236A73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#236A73">
      <circle cx="31" cy="219" r="4"/><circle cx="121" cy="203" r="4"/><circle cx="211" cy="141" r="4"/>
      <circle cx="301" cy="188" r="4"/><circle cx="391" cy="110" r="4"/><circle cx="481" cy="172" r="4"/>
      <circle cx="571" cy="94" r="4"/><circle cx="661" cy="157" r="4"/>
    </g>
    <path d="M31 235 L121 219 L211 203 L301 235 L391 188 L481 203 L571 172 L661 219"
          fill="none" stroke="#A94728" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>

    <g class="mono" font-size="10" fill="#5D696D" text-anchor="middle">
      <text x="31" y="274">W31</text><text x="121" y="274">W32</text><text x="211" y="274">W33</text>
      <text x="301" y="274">W34</text><text x="391" y="274">W35</text><text x="481" y="274">W36</text>
      <text x="571" y="274">W37</text><text x="661" y="274">W38</text>
    </g>
  </g>

  <g transform="translate(54 500)">
    <line x1="0" y1="-18" x2="792" y2="-18" stroke="#C8C2B5"/>
    <text x="0" y="8" class="body" font-size="12" fill="#5D696D">Illustrative values only. The workbook supplies context signals; it does not contain a validated demand forecast model.</text>
    <text x="792" y="28" text-anchor="end" class="mono" font-size="10" fill="#A94728">OBSERVED AND PROJECTED WEATHER MUST REMAIN DISTINCT</text>
  </g>
</svg>
