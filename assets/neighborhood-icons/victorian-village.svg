<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Victorian building/architecture icon -->
  <defs>
    <style>
      .building { fill: #faa71a; }
      .roof { fill: #d4860d; }
      .window { fill: #87ceeb; }
      .door { fill: #8b4513; }
    </style>
  </defs>

  <!-- Main building -->
  <rect class="building" x="8" y="16" width="32" height="28" />

  <!-- Roof (peaked) -->
  <polygon class="roof" points="8,16 24,4 40,16" />

  <!-- Windows - upper section -->
  <rect class="window" x="12" y="20" width="5" height="5" />
  <rect class="window" x="19" y="20" width="5" height="5" />
  <rect class="window" x="26" y="20" width="5" height="5" />
  <rect class="window" x="33" y="20" width="5" height="5" />

  <!-- Windows - middle section -->
  <rect class="window" x="12" y="28" width="5" height="5" />
  <rect class="window" x="19" y="28" width="5" height="5" />
  <rect class="window" x="26" y="28" width="5" height="5" />
  <rect class="window" x="33" y="28" width="5" height="5" />

  <!-- Windows - lower section -->
  <rect class="window" x="12" y="36" width="5" height="5" />
  <rect class="window" x="26" y="36" width="5" height="5" />
  <rect class="window" x="33" y="36" width="5" height="5" />

  <!-- Door -->
  <rect class="door" x="19" y="38" width="5" height="6" />
  <circle fill="none" stroke="#faa71a" stroke-width="0.5" cx="23.5" cy="41" r="0.8" />

  <!-- Decorative ornament on roof -->
  <circle fill="#d4860d" cx="24" cy="8" r="1.5" />
</svg>