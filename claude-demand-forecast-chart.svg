  <text x="52" y="96" class="display" font-size="30" font-weight="500" fill="#202A2E">Weekly event outlook, by ISO week</text>
  <text x="54" y="124" class="body" font-size="14" fill="#5D696D">Logged events stay distinct from baseline-derived additions; attendance is shown below.</text>

